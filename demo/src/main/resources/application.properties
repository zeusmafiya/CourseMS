spring.application.name=CoursesMS
server.port=8770

Service.CUSTOMER_NOT_FOUND=No customer found with given customer id.

Service.CUSTOMERS_NOT_FOUND=No customers found.

API.INSERT_SUCCESS=Course added successfully with course ID  

API.UPDATE_SUCCESS=Course details successfully updated with ID 

API.DELETE_SUCCESS=Course deleted successfully with ID 

API.COURSE_UPDATE_SUCCESS=Course enrolled by the Student successfully with ID 

API.COURSE_UPDATE_SUCCESS_TEACHER=Course enrolled by the Teacher successfully with ID 


MySQL settings
Change these settings according to database you are using

spring.datasource.url=jdbc:mysql://localhost:3306/course_student


spring.datasource.username=root

#If MySQL installation is password proctored,then use below property to set password
spring.datasource.password=root

#JPA settings
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.driverClassName=com.mysql.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate_ddl-auto=update

